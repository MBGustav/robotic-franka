# fr3_arm_controller with use_fake_hardware: the mock hardware only "moves"
# by copying position commands into position states, so the fake test uses
# the position interface. The real robot uses fr3_arm_controller_effort.yaml.
/**:
  fr3_arm_controller:
    ros__parameters:
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity
      joints:
        - fr3_joint1
        - fr3_joint2
        - fr3_joint3
        - fr3_joint4
        - fr3_joint5
        - fr3_joint6
        - fr3_joint7
